ss=\"help\">WASD / 方向键移动 · 空格射击 · P 暂停 · R 重开<br>首次点击或按键后播放战斗音乐，可在顶部独立关闭音乐和音效。<br>守护底部基地，消灭每关 20 辆敌军。红色坦克掉落道具，装甲坦克需要多次击中。<br>拾取星星升级火力；升至最高级可击碎钢墙。</div></main><script>\n'use strict';\n// 所有资源均由 Canvas 绘制，离线运行，无第三方依赖。\nconst canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud'),status=document.getElementById('status');\nconst W=640,H=640,S=32,dirs=[[0,-1],[1,0],[0,1],[-1,0]],keys=new Set();\nlet player,enemies,bullets,walls,particles,base,score,kills,spawned,spawnTimer,paused,ended,last=0,level=1,upgrade=0,pickups=[],powerUsed=new Set(),flash=0,nextLevel=0,soundOn=true,audio,home=true;\nconst box=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;\nfunction tone(freq,duration=.08,type='square',volume=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq/3),audio.currentTime+duration);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){}}\nfunction reset(fresh=true){home=false;document.getElementById('welcome').hidden=true;document.getElementById('gameMain').hidden=false;if(fresh){level=1;upgrade=0;score=0;}const hp=fresh?3:player.hp;player={x:244,y:600,w:26,h:26,dir:0,hp,cool:0,shield:3};enemies=[];bullets=[];particles=[];walls=[];pickups=[];powerUsed=new Set();document.querySelectorAll('[data-power]').forEach(b=>{b.disabled=false;b.style.opacity=1;});base={x:320,y:608,w:32,h:32};kills=0;spawned=0;spawnTimer=.8;paused=false;ended='';nextLevel=0;keys.clear();\n// 20×20 经典对称砖墙地图，16像素砖块可逐块击碎。\nconst map=['....................','....................','..B..B..B..B..B..B..','..B..B..B..B..B..B..','..B..B..B..B..B..B..','..B..B..BSS.B..B..B..','..B..B..B..B..B..B..','..B..B........B..B..','....................','.SS.BB..B..B..BB.SS.','....BB........BB....','........B..B........','........BBBB........','..B..B..BBBB..B..B..','..B..B..B..B..B..B..','..B..B..B..B..B..B..','..B..B........B..B..','..B..B........B..B..','.........BBB........','.........B.B........'];\nmap.forEach((row,y)=>[...row].slice(0,20).forEach((v,x)=>{if(v==='.')return;for(let a=0;a<2;a++)for(let b=0;b<2;b++)walls.push({x:x*32+a*16,y:y*32+b*16,w:16,h:16,steel:v==='S',hp:1});}));render();}\nfunction power(type){if(type==='random')type=['star','life','shield','bomb','clock'][Math.floor(Math.random()*5)];if(type==='star')upgrade=Math.min(3,upgrade+1);if(type==='life')player.hp=Math.min(9,player.hp+1);if(type==='shield')player.shield=10;if(type==='bomb'){for(const e of [...enemies])destroyEnemy(e);flash=.3;}if(type==='clock')enemies.forEach(e=>e.frozen=8);tone(900,.25,'sine');}\nfunction destroyEnemy(e){enemies.splice(enemies.indexOf(e),1);score+=e.heavy?200:100;kills++;explode(e.x+14,e.y+14,'#ffba55');if(e.red)pickups.push({x:64+Math.random()*480,y:160+Math.random()*350,w:26,h:26,type:['star','life','shield','bomb','clock'][Math.floor(Math.random()*5)],life:15});if(kills>=20){ended='第 '+level+' 关胜利！';nextLevel=2.5;tone(700,.5,'triangle');}}\nfunction blocked(t,self){return t.x<0||t.y<0||t.x+t.w>W||t.y+t.h>H||walls.some(w=>box(t,w))||box(t,base)||[player,...enemies].some(o=>o!==self&&box(t,o));}\nfunction move(t,d,dist){t.dir=d;const [dx,dy]=dirs[d],next={...t,x:t.x+dx*dist,y:t.y+dy*dist};if(blocked(next,t))return false;t.x=next.x;t.y=next.y;return true;}\nfunction shoot(t,enemy){if(t.cool>0)return;const [dx,dy]=dirs[t.dir];bullets.push({x:t.x+t.w/2+dx*20-3,y:t.y+t.h/2+dy*20-3,w:6,h:6,dx,dy,enemy});if(!enemy)tone(170,.07);t.cool=enemy?Math.max(.65,1.6-level*.1):(upgrade>=1?.17:.3);}\nfunction explode(x,y,color){tone(75,.18,'sawtooth',.05);for(let i=0;i<15;i++)particles.push({x,y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.5,color});}\nfunction finish(text){ended=text;}\nfunction update(dt){if(home||paused)return;if(ended){if(nextLevel>0){nextLevel-=dt;if(nextLevel<=0){level++;reset(false);}}return;}flash=Math.max(0,flash-dt);player.cool=Math.max(0,player.cool-dt);player.shield=Math.max(0,player.shield-dt);let d=-1;if(keys.has('ArrowUp')||keys.has('w'))d=0;else if(keys.has('ArrowRight')||keys.has('d'))d=1;else if(keys.has('ArrowDown')||keys.has('s'))d=2;else if(keys.has('ArrowLeft')||keys.has('a'))d=3;if(d>=0)move(player,d,145*dt);if(keys.has(' '))shoot(player,false);\nspawnTimer-=dt;if(spawned<20&&enemies.length<Math.min(6,3+level)&&spawnTimer<=0){const x=[16,304,596][spawned%3],t={x,y:4,w:28,h:28,dir:2,cool:.8,turn:1,heavy:spawned%4===3,hp:spawned%4===3?3:1,red:spawned%5===2,frozen:0};if(!blocked(t,t)){enemies.push(t);spawned++;spawnTimer=Math.max(.6,1.7-level*.1);}}\nfor(const e of enemies){if(e.frozen>0){e.frozen-=dt;continue;}e.cool-=dt;e.turn-=dt;if(e.turn<=0){e.dir=Math.random()<.5?2:Math.floor(Math.random()*4);e.turn=.5+Math.random();}if(!move(e,e.dir,(70+level*8+(e.heavy?0:15))*dt))e.turn=0;shoot(e,true);}\nfor(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.dx*(b.enemy?360:upgrade>=2?490:360)*dt;b.y+=b.dy*(b.enemy?360:upgrade>=2?490:360)*dt;let remove=b.x<0||b.y<0||b.x>W||b.y>H;const wall=walls.find(w=>box(b,w));if(wall){remove=true;if((!wall.steel||(!b.enemy&&upgrade===3))&&--wall.hp<=0){walls.splice(walls.indexOf(wall),1);explode(wall.x+8,wall.y+8,'#b58258');}}\nif(!remove&&box(b,base)){remove=true;explode(base.x+16,base.y+16,'#ffc45f');finish('基地被摧毁 · 防守失败');}\nif(!remove&&b.enemy&&box(b,player)){remove=true;if(player.shield<=0){player.hp--;explode(player.x+14,player.y+14,'#d2ed80');if(player.hp<=0)finish('生命耗尽 · 挑战失败');else{player.x=244;player.y=600;player.dir=0;player.shield=2;}}}\nif(!remove&&!b.enemy){const e=enemies.find(t=>box(b,t));if(e){remove=true;if(--e.hp<=0)destroyEnemy(e);else{tone(300,.05);explode(e.x+14,e.y+14,'#ccc');}}}\n\nif(remove)bullets.splice(i,1);}\npickups=pickups.filter(p=>{p.life-=dt;if(box(p,player)){power(p.type);return false;}return p.life>0;});\nparticles=particles.filter(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;return p.life>0;});}\nfunction tank(t,color){ctx.save();ctx.translate(t.x+13,t.y+13);ctx.rotate(t.dir*Math.PI/2);ctx.fillStyle='#141817';ctx.fillRect(-14,-14,7,28);ctx.fillRect(7,-14,7,28);ctx.fillStyle='#84918a';for(let i=-12;i<14;i+=5){ctx.fillRect(-13,i,5,2);ctx.fillRect(8,i,5,2);}ctx.fillStyle=color;ctx.fillRect(-9,-11,18,24);ctx.fillStyle='#ffffff55';ctx.fillRect(-8,-10,3,21);ctx.fillStyle='#1118';ctx.fillRect(6,-8,3,20);ctx.fillStyle='#26312b';ctx.fillRect(-6,-6,12,13);ctx.fillStyle=color;ctx.fillRect(-4,-5,8,9);ctx.fillRect(-2,-20,4,20);ctx.fillStyle='#f4f4d077';ctx.fillRect(-1,-19,1,10);ctx.restore();}\nfunction render(){ctx.fillStyle='#262e2f';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#2b3434';ctx.lineWidth=1;for(let x=0;x<W;x+=S){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=S){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}\nfor(const w of walls){ctx.fillStyle=w.steel?'#9ca69c':'#bf6342';ctx.fillRect(w.x,w.y,16,16);if(w.steel){ctx.strokeStyle='#4c5653';ctx.strokeRect(w.x+1,w.y+1,14,14);ctx.fillStyle='#d2d7c7';ctx.fillRect(w.x+3,w.y+3,4,4);ctx.fillStyle='#68716a';ctx.fillRect(w.x+10,w.y+10,4,4);}else{ctx.strokeStyle='#e2a078';ctx.beginPath();ctx.moveTo(w.x,w.y+1);ctx.lineTo(w.x+16,w.y+1);ctx.moveTo(w.x,w.y+8);ctx.lineTo(w.x+16,w.y+8);ctx.moveTo(w.x+8,w.y);ctx.lineTo(w.x+8,w.y+8);ctx.moveTo(w.x+4,w.y+8);ctx.lineTo(w.x+4,w.y+16);ctx.stroke();}}\nctx.fillStyle='#151a18';ctx.fillRect(base.x,base.y,32,32);ctx.fillStyle='#d7d7bd';ctx.beginPath();ctx.moveTo(base.x+16,base.y+4);ctx.lineTo(base.x+4,base.y+23);ctx.lineTo(base.x+14,base.y+18);ctx.lineTo(base.x+16,base.y+29);ctx.lineTo(base.x+18,base.y+18);ctx.lineTo(base.x+29,base.y+23);ctx.closePath();ctx.fill();\nfor(const p of pickups){ctx.fillStyle='#172220';ctx.fillRect(p.x,p.y,26,26);ctx.strokeStyle='#dbe4d4';ctx.strokeRect(p.x,p.y,26,26);ctx.fillStyle='#ffe380';ctx.font='20px sans-serif';ctx.fillText({star:'★',life:'♥',shield:'✦',bomb:'✹',clock:'◷'}[p.type],p.x+3,p.y+21);}\nif(player.shield<=0||Math.floor(player.shield*10)%2===0)tank(player,'#e7c32a');enemies.forEach(e=>tank(e,e.red?'#bc3435':e.heavy?'#b8c6ba':'#8c9e92'));bullets.forEach(b=>{ctx.fillStyle=b.enemy?'#ff9b75':'#f4ffc0';ctx.fillRect(b.x,b.y,6,6);});particles.forEach(p=>{ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillRect(p.x,p.y,4,4);});ctx.globalAlpha=1;\nif(flash>0){ctx.fillStyle='#fff8';ctx.fillRect(0,0,W,H);}hud.textContent=`得分 ${score} · 火力 ${upgrade+1} 级 · 敌军 ${kills} / 20`;document.getElementById('stats').textContent=`1P\\n生命 ${player.hp}\\n\\n⚑ ${level}\\n第 ${level} 关`; status.textContent=ended||(paused?'已暂停':'作战中 · 保护金色基地');if(ended||paused){ctx.fillStyle='#101916cc';ctx.fillRect(0,210,W,140);ctx.fillStyle='#edf7d7';ctx.textAlign='center';ctx.font='bold 27px sans-serif';ctx.fillText(ended||'已暂停',W/2,270);ctx.font='16px sans-serif';ctx.fillText(ended?(nextLevel>0?'即将进入下一关':'点击“重新开始”再战一次'):'按 P 或点击按钮继续',W/2,308);ctx.textAlign='start';}}\n\n// 原创 150 BPM 电子战斗配乐：四拍底鼓、军鼓、踩镲、低音与琶音。\nlet musicOn=true,musicReady=false,musicBus=null,musicStep=0,musicTime=0,noiseBuffer=null;\nfunction initMusic(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});if(!musicBus){musicBus=audio.createGain();musicBus.gain.value=0;const limiter=audio.createDynamicsCompressor();limiter.threshold.value=-18;limiter.ratio.value=8;musicBus.connect(limiter);limiter.connect(audio.destination);noiseBuffer=audio.createBuffer(1,audio.sampleRate*.3,audio.sampleRate);const a=noiseBuffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}musicReady=true;}catch(e){}}\nfunction musicNote(freq,t,len,volume,type='sawtooth',cutoff=1300){const o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cutoff;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.009);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(f);f.connect(g);g.connect(musicBus);o.start(t);o.stop(t+len+.02);o.onended=()=>{o.disconnect();g.disconnect();f.disconnect();};}\nfunction kick(t){const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.25);o.onended=()=>{o.disconnect();g.disconnect();};}\nfunction noise(t,snare){const n=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();n.buffer=noiseBuffer;f.type='highpass';f.frequency.value=snare?1300:7500;const len=snare?.16:.045;g.gain.setValueAtTime(snare?.23:.075,t);g.gain.exponentialRampToValueAtTime(.001,t+len);n.connect(f);f.connect(g);g.connect(musicBus);n.start(t);n.stop(t+len);n.onended=()=>{n.disconnect();f.disconnect();g.disconnect();};}\nfunction musicTick(){if(!musicReady||!musicBus)return;const active=musicOn&&(home||(!paused&&!ended))&&!document.hidden&&audio.state==='running';musicBus.gain.setTargetAtTime(active?(home?.28:.38):0,audio.currentTime,.045);if(!active){musicTime=0;return;}if(musicTime<audio.currentTime)musicTime=audio.currentTime+.025;const stepDuration=60/(home?120:150)/4;while(musicTime<audio.currentTime+.12){const n=musicStep%64,k=n%16,bar=Math.floor(n/16),root=[40,36,43,38][bar];const hz=m=>440*Math.pow(2,(m-69)/12);if(k%(home?8:4)===0)kick(musicTime);if(k===4||k===12)noise(musicTime,true);if(k%2===0)noise(musicTime,false);if(k%2===0)musicNote(hz(root+(k===14?12:0)),musicTime,.16,.21,'sawtooth',500);const pattern=[0,7,12,7,3,7,15,12];musicNote(hz(root+24+pattern[k%8]),musicTime,.085,.07,'square',2100);if(k===0)musicNote(hz(root+12),musicTime,.7,.07,'triangle',900);musicStep++;musicTime+=stepDuration;}}\nwindow.addEventListener('pointerdown',initMusic);window.addEventListener('keydown',initMusic);\ndocument.getElementById('music').onclick=()=>{musicOn=!musicOn;initMusic();document.getElementById('music').textContent='音乐：'+(musicOn?'开':'关');document.getElementById('menuMusic').textContent='♫ 音乐：'+(musicOn?'开':'关');musicTick();};\n\nfunction frame(time){const dt=Math.min((time-last)/1000,.025);last=time;update(dt);render();musicTick();requestAnimationFrame(frame);}\nwindow.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();keys.add(k);if(!e.repeat){if(home){if(k==='Enter')startGame();keys.clear();return;}if(k==='p')paused=!paused;if(k==='r')reset();}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>{keys.clear();if(!ended)paused=true;});\ndocument.querySelectorAll('[data-key]').forEach(btn=>{btn.onpointerdown=e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys.add(btn.dataset.key);};btn.onpointerup=btn.onpointercancel=btn.onlostpointercapture=()=>keys.delete(btn.dataset.key);});document.getElementById('restart').onclick=()=>reset();document.getElementById('pause').onclick=()=>paused=!paused;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent='音效：'+(soundOn?'开':'关');};\ndocument.querySelectorAll('[data-power]').forEach(b=>b.onclick=()=>{if(ended||paused||powerUsed.has(b.dataset.power))return;powerUsed.add(b.dataset.power);power(b.dataset.power);b.disabled=true;b.style.opacity=.5;});\nif(document.getElementById('stick')){\nconst stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;\nfunction stickMove(e){if(e.pointerId!==stickId)return;const r=stick.getBoundingClientRect(),dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/
